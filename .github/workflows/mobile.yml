name: Mobile apps

on:
  push:
    paths: ["android/**", "ios/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["android/**", "ios/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android command-line build tools
        run: sudo apt-get update && sudo apt-get install -y aapt zipalign apksigner dalvik-exchange
      - name: Unit tests
        run: android/test.sh
      - name: Build debug APK
        run: android/build.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Unit tests (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project DCCPortal.xcodeproj -scheme DCCPortal -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO
      - name: Build Release for device (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project DCCPortal.xcodeproj -scheme DCCPortal -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
