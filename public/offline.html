<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · DCC Portal</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --primary:#1e3a8a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --card:#131c31; --text:#e2e8f0; --muted:#94a3b8; --line:#23304b; --primary:#93a9ff; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 520px; margin: 0 auto; padding: 40px 16px; }
  .logo { width:56px; height:56px; border-radius:14px; background:#1e3a8a; color:#fbbf24; font-weight:800; display:grid; place-items:center; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
  button { height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #1e3a8a; color: #fff; font-weight: 600; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 22px; overflow: hidden; }
  .card h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .card a { display: block; padding: 11px 14px; border-top: 1px solid var(--line); color: var(--primary); text-decoration: none; }
  .card a:first-of-type { border-top: 0; }
  .card small { display:block; color: var(--muted); }
  .empty { padding: 14px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="logo">DCC</div>
  <h1>You're offline</h1>
  <p>This page hasn't been saved on this device yet. Pages you've opened while online are available below as read-only copies. Changes can be made again once you're back online.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="card"><h2>Available offline</h2><div id="list"><div class="empty">Checking saved pages…</div></div></div>
</main>
<script>
  (async function () {
    var list = document.getElementById("list");
    try {
      var cache = await caches.open("dcc-pages-v1");
      var keys = await cache.keys();
      if (!keys.length) { list.innerHTML = '<div class="empty">No pages saved yet. Open pages while online to read them offline later.</div>'; return; }
      var items = await Promise.all(keys.map(async function (req) {
        var res = await cache.match(req);
        var html = res ? await res.clone().text() : "";
        var m = html.match(/<title>([^<]*)<\/title>/i);
        var saved = res && res.headers.get("x-dcc-saved-at");
        return { url: new URL(req.url).pathname + new URL(req.url).search, title: m ? m[1] : new URL(req.url).pathname, saved: saved };
      }));
      items.sort(function (a, b) { return (b.saved || "").localeCompare(a.saved || ""); });
      list.innerHTML = "";
      items.forEach(function (it) {
        var a = document.createElement("a");
        a.href = it.url;
        a.textContent = it.title.replace(/ · DCC Portal$/, "");
        var s = document.createElement("small");
        s.textContent = it.url + (it.saved ? " · saved " + new Date(it.saved).toLocaleString() : "");
        a.appendChild(s);
        list.appendChild(a);
      });
    } catch (e) { list.innerHTML = '<div class="empty">Saved pages are not available in this browser.</div>'; }
    window.addEventListener("online", function () { location.reload(); });
  })();
</script>
</body>
</html>
